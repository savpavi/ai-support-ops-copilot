name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the full test suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify the workflow artifact matches its sources
        run: python3 scripts/build_workflow.py
      - name: Print the aligned evaluation summary
        run: python3 scripts/evaluate_requests.py
      - name: Print the honest paraphrase evaluation summary
        run: python3 scripts/evaluate_requests.py --dataset paraphrase
